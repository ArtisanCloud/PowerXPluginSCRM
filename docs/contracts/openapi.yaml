openapi: 3.1.0
info:
  title: PowerX Plugin Skeleton API
  version: 0.1.0
servers:
  - url: http://localhost:8077
paths:
  /api/v1/ping:
    get:
      summary: Ping
      description: Returns basic service health.
      responses:
        '200':
          description: Successful ping response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
  /healthz:
    get:
      summary: Health check
      description: Framework-provided health probe endpoint.
      responses:
        '200':
          description: Service is healthy
