id: com.powerx.plugins.scrm.opportunity.write
type: API
version: 1.0.0
description: "创建、更新、推进、关闭、重开商机并维护报价单和跟进任务的管理端能力。"
rbac:
  resource: scrm.opportunity
  actions: [write]
metadata:
  protocols:
    rest:
      - method: POST
        path: /api/v1/admin/opportunity/records
      - method: PUT
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/line-items
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/quote-files
      - method: DELETE
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/line-items/{item_uuid}
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/tasks
      - method: PATCH
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/tasks/{task_uuid}/status
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/stage
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/close
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/reopen
      - method: POST
        path: /api/v1/admin/opportunity/records/{opportunity_uuid}/risk

