id: com.powerx.plugin.scrm.template.read
type: API
version: 1.0.0
description: "读取单个模板详情的原子能力。"
rbac:
  resource: base:template
  actions: [read]
provides:
  - id: schema/input/com.powerx.plugin.scrm.template.read.v1
    path: schema/input/com.powerx.plugin.scrm.template.read.json
    kind: input
    version: 1.0.0
  - id: schema/output/com.powerx.plugin.scrm.template.read.v1
    path: schema/output/com.powerx.plugin.scrm.template.read.json
    kind: output
    version: 1.0.0
metadata:
  protocols:
    rest:
      method: GET
      path: /api/v1/templates/{id}
      description: "基于模板 ID 的 REST 详情入口"
    grpc:
      service: powerx.template.TemplateService
      method: GetTemplate
    agent_tool:
      id: base.template.read
      scope: agent.template.read
      transport: http
      endpoint: /api/v1/templates/{id}
