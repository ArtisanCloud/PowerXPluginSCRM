openapi: 3.0.3
info:
  title: Opportunity Sales Pipeline API
  version: 0.2.0
  description: Opportunity 商机管理合同（含 Lead 资格推进、销售管道工作台与活动流）
servers:
  - url: /api/v1/admin
paths:
  /leads/{lead_uuid}/qualification:
    post:
      summary: 推进/回退线索资格阶段（MQL/SQL）
      tags: [LeadQualification]
      parameters:
        - in: path
          name: lead_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 推荐使用 target_status；status 为兼容字段。两者至少传一个，且 target_status 优先。
              properties:
                target_status:
                  type: string
                  enum: [mql, sql, rollback]
                status:
                  type: string
                  enum: [mql, sql, rollback]
                  description: 兼容字段，推荐改用 target_status。
                reason:
                  type: string
      responses:
        '200':
          description: updated
        '422':
          description: invalid transition
  /opportunity/records:
    post:
      summary: 创建商机
      tags: [Opportunity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityRecord'
        '409':
          description: active opportunity conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_ACTIVE_CONFLICT
                  message:
                    type: string
                    example: lead already has active opportunity
                  opportunity_uuid:
                    type: string
                    format: uuid
        '422':
          description: lead is not qualified
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: LEAD_NOT_QUALIFIED
                  message:
                    type: string
                    example: lead status must be sql or converted before creating opportunity
    get:
      summary: 商机列表
      tags: [Opportunity]
      parameters:
        - in: query
          name: stage
          schema:
            type: string
        - in: query
          name: owner_user_uuid
          deprecated: true
          schema:
            type: string
            format: uuid
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        - in: query
          name: owner_member_uuid
          schema:
            type: string
            format: uuid
          description: 负责人租户成员 UUID。
        - in: query
          name: lead_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: page
          deprecated: true
          schema:
            type: integer
        - in: query
          name: page_size
          deprecated: true
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityRecord'
  /opportunity/dashboard:
    get:
      summary: 商机工作台聚合数据
      description: 基于当前筛选条件返回活跃商机数、管道金额、赢单金额、风险商机数与阶段分布。
      tags: [Opportunity]
      parameters:
        - in: query
          name: owner_user_uuid
          deprecated: true
          schema:
            type: string
            format: uuid
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        - in: query
          name: owner_member_uuid
          schema:
            type: string
            format: uuid
          description: 负责人租户成员 UUID。
        - in: query
          name: source_channel
          schema:
            type: string
        - in: query
          name: expected_close_from
          schema:
            type: string
            format: date-time
        - in: query
          name: expected_close_to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDashboard'
  /opportunity/forecast:
    get:
      summary: 商机预测看板
      description: 基于阶段、金额、成交概率、预计成交时间、负责人和来源聚合预测金额。
      tags: [Opportunity]
      parameters:
        - in: query
          name: owner_member_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: source_channel
          schema:
            type: string
        - in: query
          name: expected_close_from
          schema:
            type: string
            format: date-time
        - in: query
          name: expected_close_to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityForecast'
  /opportunity/stage-configs:
    get:
      summary: 商机阶段配置列表
      description: 返回默认阶段组下的阶段配置；未保存过配置时返回默认阶段组模板，不写库。
      tags: [Opportunity]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityStageConfig'
  /opportunity/stage-configs/{stage_key}:
    put:
      summary: 保存商机阶段配置
      tags: [Opportunity]
      parameters:
        - in: path
          name: stage_key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStageConfigRequest'
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityStageConfig'
  /opportunity/pipeline/default:
    get:
      summary: 默认商机阶段组
      description: 返回当前租户默认阶段组及其阶段配置；当请求上下文包含有效 member actor 且租户尚未初始化阶段组时，会创建默认阶段组和默认阶段。
      tags: [Opportunity]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPipeline'
  /opportunity/pipeline-templates:
    get:
      summary: 内置商机流程模板列表
      description: 返回 seed 写入的行业销售流程模板及模板阶段；用户可基于模板创建自己的商机阶段组。
      tags: [Opportunity]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityPipelineTemplate'
  /opportunity/pipeline-groups:
    get:
      summary: 商机阶段组列表
      tags: [Opportunity]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityPipelineGroup'
    post:
      summary: 创建商机阶段组
      tags: [Opportunity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePipelineGroupRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPipeline'
  /opportunity/pipeline-groups/{group_uuid}:
    get:
      summary: 商机阶段组详情
      tags: [Opportunity]
      parameters:
        - in: path
          name: group_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPipeline'
  /opportunity/records/{opportunity_uuid}:
    get:
      summary: 商机详情
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityRecord'
    put:
      summary: 更新商机基础字段
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                probability:
                  type: integer
                  minimum: 0
                  maximum: 100
                owner_user_uuid:
                  type: string
                  format: uuid
                  deprecated: true
                  description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
                owner_member_uuid:
                  type: string
                  format: uuid
                  description: 负责人租户成员 UUID。
                expected_close_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: updated
  /opportunity/records/{opportunity_uuid}/duplicates:
    get:
      summary: 检测重复商机候选
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DuplicateOpportunityCandidate'
  /opportunity/records/{opportunity_uuid}/merge:
    post:
      summary: 合并重复商机到当前商机
      description: 将来源商机的活动、报价、任务、合同和回款迁移到当前商机，并把来源商机标记为 lost。
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_opportunity_uuid]
              properties:
                source_opportunity_uuid:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityRecord'
  /opportunity/records/{opportunity_uuid}/line-items:
    get:
      summary: 商机报价单列表
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityLineItem'
    post:
      summary: 新增商机手工报价记录（兼容接口）
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityLineItem'
  /opportunity/records/{opportunity_uuid}/quote-files:
    post:
      summary: 上传商机报价单附件
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                total_amount:
                  type: number
                currency:
                  type: string
                  default: CNY
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityLineItem'
  /opportunity/records/{opportunity_uuid}/line-items/{item_uuid}/download:
    get:
      summary: 下载商机报价单附件
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: item_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: file
  /opportunity/records/{opportunity_uuid}/line-items/{item_uuid}/approval:
    patch:
      summary: 更新报价版本审批状态
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: item_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, withdraw, approve, reject, effective]
                comment:
                  type: string
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityLineItem'
        '422':
          description: invalid quote transition
  /opportunity/records/{opportunity_uuid}/line-items/{item_uuid}:
    delete:
      summary: 删除商机报价单记录
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: item_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: deleted
  /opportunity/records/{opportunity_uuid}/tasks:
    get:
      summary: 商机跟进任务列表
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityTask'
    post:
      summary: 新增商机跟进任务
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityTask'
  /opportunity/records/{opportunity_uuid}/tasks/{task_uuid}/status:
    patch:
      summary: 更新商机跟进任务状态
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: task_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, done]
      responses:
        '200':
          description: updated
  /opportunity/records/{opportunity_uuid}/contracts:
    get:
      summary: 商机合同列表
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityContract'
    post:
      summary: 创建商机关联合同
      description: 合同可从赢单商机金额或生效报价生成，创建后写入商机活动流。
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityContract'
        '422':
          description: invalid contract payload
  /opportunity/records/{opportunity_uuid}/contracts/{contract_uuid}/status:
    patch:
      summary: 更新合同签署状态
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: contract_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, pending_signature, signed, cancelled]
                signed_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityContract'
  /opportunity/records/{opportunity_uuid}/payments:
    get:
      summary: 商机回款计划与汇总
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityPayment'
                  summary:
                    $ref: '#/components/schemas/PaymentSummary'
    post:
      summary: 新增回款计划
      description: 回款计划挂合同，不反向自动修改商机 won/lost 终态。
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPayment'
  /opportunity/records/{opportunity_uuid}/payments/{payment_uuid}/status:
    patch:
      summary: 更新回款状态或登记实收
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: payment_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequest'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPayment'
  /opportunity/records/{opportunity_uuid}/stage:
    post:
      summary: 商机阶段推进
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [open, qualified, proposal, negotiation]
                note:
                  type: string
      responses:
        '200':
          description: updated
        '422':
          description: invalid stage transition
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_STAGE_INVALID
                  message:
                    type: string
                    example: invalid stage transition
  /opportunity/records/{opportunity_uuid}/close:
    post:
      summary: 商机赢单/输单
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [won, lost]
                lost_reason:
                  type: string
      responses:
        '200':
          description: closed
        '422':
          description: invalid close input
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_CLOSE_INVALID
                  message:
                    type: string
                    example: lost_reason is required when result=lost
  /opportunity/records/{opportunity_uuid}/reopen:
    post:
      summary: 重开终态商机
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: reopened
        '422':
          description: not in terminal stage
  /opportunity/records/{opportunity_uuid}/activities:
    get:
      summary: 商机活动流
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpportunityActivity'

components:
  parameters:
    OpportunityUUID:
      in: path
      name: opportunity_uuid
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateOpportunityRequest:
      type: object
      required: [lead_uuid, title, owner_user_uuid]
      properties:
        lead_uuid:
          type: string
          format: uuid
        title:
          type: string
        owner_user_uuid:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        owner_member_uuid:
          type: string
          format: uuid
          description: 负责人租户成员 UUID。创建时 owner_user_uuid 与 owner_member_uuid 至少传一个。
        amount:
          type: number
        currency:
          type: string
          default: CNY
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_at:
          type: string
          format: date-time
      example:
        lead_uuid: 8b86f1aa-3f59-4f85-9869-2f5e9fc8d2af
        title: 华东门店年度采购商机
        owner_member_uuid: 60c7f053-0d8b-41b4-b7d9-7fe94d884d50
        amount: 68000
        currency: CNY
        probability: 20
        expected_close_at: "2026-06-30T10:00:00Z"
    OpportunityRecord:
      type: object
      properties:
        opportunity_uuid:
          type: string
          format: uuid
        lead_uuid:
          type: string
          format: uuid
        title:
          type: string
        stage:
          type: string
          enum: [open, qualified, proposal, negotiation, won, lost]
        pipeline_group_uuid:
          type: string
          format: uuid
          nullable: true
        current_stage_uuid:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currency:
          type: string
        probability:
          type: integer
          minimum: 0
          maximum: 100
        owner_user_uuid:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为租户成员 UUID，推荐读取 owner_member_uuid。
        owner_member_uuid:
          type: string
          format: uuid
