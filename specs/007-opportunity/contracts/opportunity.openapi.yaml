openapi: 3.0.3
info:
  title: Opportunity Sales Pipeline API
  version: 0.2.0
  description: Opportunity 商机管理合同（含 Lead 资格推进、销售管道工作台与活动流）
servers:
  - url: /api/v1/admin
paths:
  /leads/{lead_uuid}/qualification:
    post:
      summary: 推进/回退线索资格阶段（MQL/SQL）
      tags: [LeadQualification]
      parameters:
        - in: path
          name: lead_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 推荐使用 target_status；status 为兼容字段。两者至少传一个，且 target_status 优先。
              properties:
                target_status:
                  type: string
                  enum: [mql, sql, rollback]
                status:
                  type: string
                  enum: [mql, sql, rollback]
                  description: 兼容字段，推荐改用 target_status。
                reason:
                  type: string
      responses:
        '200':
          description: updated
        '422':
          description: invalid transition
  /opportunity/records:
    post:
      summary: 创建商机
      tags: [Opportunity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityRecord'
        '409':
          description: active opportunity conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_ACTIVE_CONFLICT
                  message:
                    type: string
                    example: lead already has active opportunity
                  opportunity_uuid:
                    type: string
                    format: uuid
        '422':
          description: lead is not qualified
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: LEAD_NOT_QUALIFIED
                  message:
                    type: string
                    example: lead status must be sql or converted before creating opportunity
    get:
      summary: 商机列表
      tags: [Opportunity]
      parameters:
        - in: query
          name: stage
          schema:
            type: string
        - in: query
          name: owner_user_uuid
          deprecated: true
          schema:
            type: string
            format: uuid
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        - in: query
          name: owner_member_uuid
          schema:
            type: string
            format: uuid
          description: 负责人租户成员 UUID。
        - in: query
          name: lead_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: page
          deprecated: true
          schema:
            type: integer
        - in: query
          name: page_size
          deprecated: true
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityRecord'
  /opportunity/dashboard:
    get:
      summary: 商机工作台聚合数据
      description: 基于当前筛选条件返回活跃商机数、管道金额、赢单金额、风险商机数与阶段分布。
      tags: [Opportunity]
      parameters:
        - in: query
          name: owner_user_uuid
          deprecated: true
          schema:
            type: string
            format: uuid
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        - in: query
          name: owner_member_uuid
          schema:
            type: string
            format: uuid
          description: 负责人租户成员 UUID。
        - in: query
          name: source_channel
          schema:
            type: string
        - in: query
          name: expected_close_from
          schema:
            type: string
            format: date-time
        - in: query
          name: expected_close_to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDashboard'
  /opportunity/records/{opportunity_uuid}:
    get:
      summary: 商机详情
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityRecord'
    put:
      summary: 更新商机基础字段
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                probability:
                  type: integer
                  minimum: 0
                  maximum: 100
                owner_user_uuid:
                  type: string
                  format: uuid
                  deprecated: true
                  description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
                owner_member_uuid:
                  type: string
                  format: uuid
                  description: 负责人租户成员 UUID。
                expected_close_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: updated
  /opportunity/records/{opportunity_uuid}/line-items:
    get:
      summary: 商机报价单列表
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityLineItem'
    post:
      summary: 新增商机手工报价记录（兼容接口）
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityLineItem'
  /opportunity/records/{opportunity_uuid}/quote-files:
    post:
      summary: 上传商机报价单附件
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                total_amount:
                  type: number
                currency:
                  type: string
                  default: CNY
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityLineItem'
  /opportunity/records/{opportunity_uuid}/line-items/{item_uuid}/download:
    get:
      summary: 下载商机报价单附件
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: item_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: file
  /opportunity/records/{opportunity_uuid}/line-items/{item_uuid}:
    delete:
      summary: 删除商机报价单记录
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: item_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: deleted
  /opportunity/records/{opportunity_uuid}/tasks:
    get:
      summary: 商机跟进任务列表
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpportunityTask'
    post:
      summary: 新增商机跟进任务
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityTask'
  /opportunity/records/{opportunity_uuid}/tasks/{task_uuid}/status:
    patch:
      summary: 更新商机跟进任务状态
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
        - in: path
          name: task_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, done]
      responses:
        '200':
          description: updated
  /opportunity/records/{opportunity_uuid}/stage:
    post:
      summary: 商机阶段推进
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [open, qualified, proposal, negotiation]
                note:
                  type: string
      responses:
        '200':
          description: updated
        '422':
          description: invalid stage transition
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_STAGE_INVALID
                  message:
                    type: string
                    example: invalid stage transition
  /opportunity/records/{opportunity_uuid}/close:
    post:
      summary: 商机赢单/输单
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [won, lost]
                lost_reason:
                  type: string
      responses:
        '200':
          description: closed
        '422':
          description: invalid close input
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OPPORTUNITY_CLOSE_INVALID
                  message:
                    type: string
                    example: lost_reason is required when result=lost
  /opportunity/records/{opportunity_uuid}/reopen:
    post:
      summary: 重开终态商机
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: reopened
        '422':
          description: not in terminal stage
  /opportunity/records/{opportunity_uuid}/activities:
    get:
      summary: 商机活动流
      tags: [Opportunity]
      parameters:
        - $ref: '#/components/parameters/OpportunityUUID'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpportunityActivity'

components:
  parameters:
    OpportunityUUID:
      in: path
      name: opportunity_uuid
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateOpportunityRequest:
      type: object
      required: [lead_uuid, title, owner_user_uuid]
      properties:
        lead_uuid:
          type: string
          format: uuid
        title:
          type: string
        owner_user_uuid:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为租户成员 UUID，推荐使用 owner_member_uuid。
        owner_member_uuid:
          type: string
          format: uuid
          description: 负责人租户成员 UUID。创建时 owner_user_uuid 与 owner_member_uuid 至少传一个。
        amount:
          type: number
        currency:
          type: string
          default: CNY
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_at:
          type: string
          format: date-time
      example:
        lead_uuid: 8b86f1aa-3f59-4f85-9869-2f5e9fc8d2af
        title: 华东门店年度采购商机
        owner_member_uuid: 60c7f053-0d8b-41b4-b7d9-7fe94d884d50
        amount: 68000
        currency: CNY
        probability: 20
        expected_close_at: "2026-06-30T10:00:00Z"
    OpportunityRecord:
      type: object
      properties:
        opportunity_uuid:
          type: string
          format: uuid
        lead_uuid:
          type: string
          format: uuid
        title:
          type: string
        stage:
          type: string
          enum: [open, qualified, proposal, negotiation, won, lost]
        amount:
          type: number
        currency:
          type: string
        probability:
          type: integer
          minimum: 0
          maximum: 100
        owner_user_uuid:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为租户成员 UUID，推荐读取 owner_member_uuid。
        owner_member_uuid:
          type: string
          format: uuid
          description: 负责人租户成员 UUID。
        source_channel:
          type: string
          nullable: true
        source_app_type:
          type: string
          nullable: true
        source_account_uuid:
          type: string
          format: uuid
          nullable: true
        external_userid:
          type: string
          nullable: true
        expected_close_at:
          type: string
          format: date-time
          nullable: true
        won_at:
          type: string
          format: date-time
          nullable: true
        lost_at:
          type: string
          format: date-time
          nullable: true
        lost_reason:
          type: string
          nullable: true
        risk_flags:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为创建人租户成员 UUID。
        created_by_member_uuid:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
          deprecated: true
          description: 兼容字段；当前语义为更新人租户成员 UUID。
        updated_by_member_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateLineItemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        total_amount:
          type: number
        currency:
          type: string
          default: CNY
    OpportunityLineItem:
      type: object
      properties:
        item_uuid:
          type: string
          format: uuid
        opportunity_uuid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [manual, quote_file]
        name:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        total_amount:
          type: number
        currency:
          type: string
        storage_provider:
          type: string
        object_key:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        content_type:
          type: string
        download_url:
          type: string
      example:
        item_uuid: 0d78d734-508e-4d5f-9285-94f87e7e42f0
        opportunity_uuid: 9af60723-4c1d-4792-bbe3-d04e37b0d6c9
        kind: quote_file
        name: 报价单附件
        quantity: 1
        unit_price: 68000
        total_amount: 68000
        currency: CNY
        storage_provider: local
        file_name: quote-v2.pdf
        file_size: 1048576
        content_type: application/pdf
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        due_at:
          type: string
          format: date-time
    OpportunityTask:
      type: object
      properties:
        task_uuid:
          type: string
          format: uuid
        opportunity_uuid:
          type: string
          format: uuid
        title:
          type: string
        due_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [open, done]
    OpportunityDashboard:
      type: object
      properties:
        active_count:
          type: integer
        pipeline_amount:
          type: number
        won_amount:
          type: number
        risk_count:
          type: integer
        stage_summaries:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
                enum: [open, qualified, proposal, negotiation, won, lost]
              count:
                type: integer
              amount:
                type: number
    OpportunityActivity:
      type: object
      properties:
        activity_uuid:
          type: string
          format: uuid
        activity_type:
          type: string
          enum: [create, stage_change, close, reopen, note, risk_flag, line_item, task]
        from_stage:
          type: string
          nullable: true
        to_stage:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        operator_user_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
