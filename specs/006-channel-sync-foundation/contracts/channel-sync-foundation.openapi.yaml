openapi: 3.0.3
info:
  title: Channel Sync Foundation API
  version: 0.1.0
  description: 渠道授权接入与双向同步基础域契约（企业微信首发）

paths:
  /admin/social/openwork/foundation/access/status:
    get:
      summary: 查询接入基础状态
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/bindings:
    get:
      summary: 查询 tenant-corp-account 绑定列表
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK
    post:
      summary: 创建或回填绑定关系
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/sync-jobs:
    get:
      summary: 查询同步任务列表
      tags: [SyncJobs]
      responses:
        '200':
          description: OK
    post:
      summary: 创建同步任务（标签/组织/外部联系人/线索）
      tags: [SyncJobs]
      responses:
        '202':
          description: Accepted

  /admin/social/openwork/foundation/sync-jobs/{job_uuid}/replay:
    post:
      summary: 重放失败或死信任务
      tags: [SyncJobs]
      parameters:
        - name: job_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted

  /admin/social/openwork/foundation/conflicts:
    get:
      summary: 查询双向冲突队列
      tags: [SyncConflict]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/conflicts/{conflict_uuid}/resolve:
    post:
      summary: 人工处理冲突
      tags: [SyncConflict]
      parameters:
        - name: conflict_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/writeback/policies:
    get:
      summary: 查询回写策略
      tags: [WritebackPolicy]
      responses:
        '200':
          description: OK
    put:
      summary: 更新回写策略
      tags: [WritebackPolicy]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/metrics/overview:
    get:
      summary: 查询基础域可观测汇总
      tags: [Observability]
      responses:
        '200':
          description: OK
