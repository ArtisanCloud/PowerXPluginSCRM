openapi: 3.0.3
info:
  title: Channel Sync Foundation API
  version: 0.2.0
  description: 渠道授权接入与双向同步基础域契约（渠道中立，WeCom 首发）

paths:
  /admin/social/openwork/foundation/access/status:
    get:
      summary: 查询接入基础状态
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationAccessStatusResponse'

  /admin/social/openwork/foundation/bindings:
    get:
      summary: 查询 tenant-corp-channel_account 绑定列表
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK
    post:
      summary: 创建或回填绑定关系
      tags: [FoundationAccess]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/capabilities:
    get:
      summary: 查询渠道能力矩阵
      tags: [Capability]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityMatrixResponse'

  /admin/social/openwork/foundation/sync-jobs:
    get:
      summary: 查询同步任务列表
      tags: [SyncJobs]
      responses:
        '200':
          description: OK
    post:
      summary: 创建同步任务（标签/组织/外部联系人/线索）
      tags: [SyncJobs]
      responses:
        '202':
          description: Accepted

  /admin/social/openwork/foundation/sync-jobs/{job_uuid}/replay:
    post:
      summary: 重放失败或死信任务
      tags: [SyncJobs]
      parameters:
        - name: job_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted

  /admin/social/openwork/foundation/conflicts:
    get:
      summary: 查询双向冲突队列
      tags: [SyncConflict]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/conflicts/{conflict_uuid}/resolve:
    post:
      summary: 人工处理冲突
      tags: [SyncConflict]
      parameters:
        - name: conflict_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/dead-letters:
    get:
      summary: 查询死信任务队列
      tags: [DeadLetters]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/dead-letters/{dead_letter_uuid}/replay:
    post:
      summary: 重放死信任务
      tags: [DeadLetters]
      parameters:
        - name: dead_letter_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted

  /admin/social/openwork/foundation/writeback/policies:
    get:
      summary: 查询回写策略
      tags: [WritebackPolicy]
      responses:
        '200':
          description: OK
    put:
      summary: 更新回写策略
      tags: [WritebackPolicy]
      responses:
        '200':
          description: OK

  /admin/social/openwork/foundation/metrics/overview:
    get:
      summary: 查询基础域可观测汇总
      tags: [Observability]
      responses:
        '200':
          description: OK

components:
  schemas:
    FoundationAccessStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [auth_status, token_status, callback_status, capability_status]
          properties:
            auth_status:
              type: string
              enum: [authorized, expired, revoked, pending]
            token_status:
              type: string
              enum: [valid, expiring, invalid]
            callback_status:
              type: string
              enum: [ok, error, pending]
            last_sync_at:
              type: string
              format: date-time
              nullable: true
            capability_status:
              $ref: '#/components/schemas/CapabilityStatus'

    CapabilityMatrixResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            required: [domain, capability_status]
            properties:
              domain:
                type: string
                enum: [auth, tags, org, external_contacts, leads]
              capability_status:
                $ref: '#/components/schemas/CapabilityStatus'
              reason:
                type: string
                nullable: true

    CapabilityStatus:
      type: string
      description: 能力可用状态
      enum: [supported, partial, not_supported, planned]
