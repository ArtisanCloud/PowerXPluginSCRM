permissions:
  - actions:
      - create
      - delete
      - read
      - update
    resource: template
  - actions:
      - create
      - read
      - update
    resource: channel_code
  - actions:
      - create
      - read
    resource: integration
  - actions:
      - read
      - publish
    resource: channel_welcome_sync
rbac:
  resources:
    - actions:
        - create
        - delete
        - read
        - update
      resource: template
    - actions:
        - create
        - read
        - update
      resource: channel_code
    - actions:
        - create
        - read
      resource: integration
    - actions:
        - read
        - publish
      resource: channel_welcome_sync
routes:
  adminManifest: /api/v1/admin/manifest
  basePath: /api/v1
  permissions:
    - method: POST
      path: /api/v1/integration/capabilities/invoke
      permission:
        action: create
        resource: integration
  rbac: /api/v1/admin/rbac
