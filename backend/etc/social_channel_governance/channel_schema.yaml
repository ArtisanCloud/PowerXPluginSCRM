version: 1
channels:
  - code: wechat
    label: 微信生态
    app_types:
      - code: wecom
        label: 企业微信
        fields:
          - key: agent_id
            label: 应用 AgentID
            required: true
            span: 1
            placeholder: 企业微信应用 AgentID
            hint: 企业微信应用 AgentID（应用管理里查看）。
          - key: corp_id
            label: 企业 ID（CorpID）
            required: true
            span: 1
            placeholder: 企业微信企业 ID
            hint: 企业微信企业 ID（CorpID）。
          - key: secret
            label: 通讯录管理 Secret
            required: false
            span: 1
            placeholder: 通讯录管理 Secret
            hint: 通讯录管理 Secret（管理工具-通讯录同步）。留空会导致同步/测试失败。
            input_type: password
          - key: app_secret
            label: 应用 Secret
            required: false
            span: 1
            placeholder: 应用 Secret
            hint: 应用 Secret（应用管理里查看）。用于非通讯录场景。
            input_type: password
          - key: token
            label: Token（回调校验）
            required: false
            span: 2
            placeholder: Webhook Token / 回调校验 Token
            input_type: password
          - key: aes_key
            label: EncodingAESKey
            required: false
            span: 2
            placeholder: EncodingAESKey
            hint: 回调消息加解密密钥（企业微信后台生成）
            input_type: password
          - key: account_id
            label: 账号 ID
            required: false
            hidden: true
            derived_from: agent_id
            hint: 账号 ID 自动使用应用 AgentID。
          - key: callback_base_url
            label: 回调域名
            required: false
            span: 2
            placeholder: https://debug-scrm.artisan-cloud.com
            hint: 留空则使用服务端配置 callback_base_url。
          - key: expires_at
            label: 授权过期时间
            required: false
            span: 2
            input_type: datetime-local
      - code: mp
        label: 公众号
        fields:
          - key: account_id
            label: 账号 ID
            required: false
            hidden: true
            derived_from: app_id
            hint: 公众号仅需 AppID 与 AppSecret，账号 ID 自动使用 AppID。
          - key: app_id
            label: AppID
            required: true
            placeholder: AppID
          - key: app_secret
            label: AppSecret
            required: false
            placeholder: AppSecret
            hint: 留空会导致同步/测试失败。
            input_type: password
          - key: token
            label: Token（回调校验）
            required: false
            placeholder: Webhook Token / 回调校验 Token
            input_type: password
          - key: expires_at
            label: 授权过期时间
            required: false
            input_type: datetime-local
      - code: miniapp
        label: 小程序
        fields:
          - key: account_id
            label: 账号 ID
            required: false
            hidden: true
            derived_from: app_id
            hint: 小程序仅需 AppID 与 AppSecret，账号 ID 自动使用 AppID。
          - key: app_id
            label: AppID
            required: true
            placeholder: AppID
          - key: app_secret
            label: AppSecret
            required: false
            placeholder: AppSecret
            hint: 留空会导致同步/测试失败。
            input_type: password
          - key: token
            label: Token（回调校验）
            required: false
            placeholder: Webhook Token / 回调校验 Token
            input_type: password
          - key: expires_at
            label: 授权过期时间
            required: false
            input_type: datetime-local
      - code: video
        label: 视频号
        fields:
          - key: account_id
            label: 账号 ID
            required: false
            hidden: true
            derived_from: app_id
            hint: 视频号仅需 AppID 与 AppSecret，账号 ID 自动使用 AppID。
          - key: app_id
            label: AppID
            required: true
            placeholder: AppID
          - key: app_secret
            label: AppSecret
            required: false
            placeholder: AppSecret
            hint: 留空会导致同步/测试失败。
            input_type: password
          - key: token
            label: Token（回调校验）
            required: false
            placeholder: Webhook Token / 回调校验 Token
            input_type: password
          - key: expires_at
            label: 授权过期时间
            required: false
            input_type: datetime-local
