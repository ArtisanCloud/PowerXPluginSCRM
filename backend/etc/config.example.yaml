# Skeleton 插件示例配置
# 将本文件复制为 backend/etc/config.yaml 即可覆盖默认配置。
#
# Auth / IAM / 运行模式环境变量速查（未在 YAML 中硬编码，以免泄露敏感信息）：
#   IAMMode                    - IAM 语义：delegated | local（推荐显式配置）
#   POWERX_PROXY                - 设为 1 时表示运行在宿主 iframe/代理下（Delegated 模式）
#   POWERX_CORE_ENDPOINT        - Delegated 模式访问宿主 Core API 的基址（默认 http://localhost:8077）
#   POWERX_AUTH_TOKEN           - 插件向宿主 Core 鉴权用的服务 Token
#   POWERX_AUTH_OPTIONAL        - 调试专用，true 时允许未携带 Token 的请求（仅限本地）
#   PLUGIN_IAM_TENANT_KEY/NAME  - Standalone 模式默认租户唯一键与显示名
#   PLUGIN_IAM_ADMIN_EMAIL      - Standalone 模式默认管理员邮箱（用于 migrate/seed）
#   PLUGIN_IAM_ADMIN_PASSWORD   - Standalone 模式默认管理员密码（用于 migrate/seed）
#   NUXT_PUBLIC_INSIDE_POWERX   - 前端运行时使用，'1' 代表宿主模式；否则渲染 Standalone 菜单（含“组织与权限”）
#   NUXT_PUBLIC_POWERX_PROXY    - 与上类似，供 runtimeConfig 判断 API Base

server:
  bind_addr: ":8078"
  # 回调公网基址（用于企业微信等回调拼接）
  # callback_base_url: "https://debug-scrm.artisan-cloud.com"
  api_prefix: "/api/v1"
  log_level: "debug"
  dev_mode: true

# gRPC 上游（可选，默认关闭）
grpc_upstream:
  address: "localhost:8079"
  tenant_uuid: "00000000-0000-0000-0000-000000000001"
  use_tls: false
  sts_client_id: ""
  sts_client_secret: ""
  sts_audience: "powerx:api"
  sts_scope: "access"
  sts_ttl: "300s"
  connect_mode: "lazy"
  optional: true

gateway:
  # 宿主模式出站访问 PowerX 时使用 gRPC STS Exchange 获取短期 Bearer token。
  # 若留空则默认关闭 Gateway 调用，`PX_USE_MOCK` 可指定 media,eventfabric 等模块名称以启用内存 Mock。
  # 凭证分流：
  # - auth_scheme=bearer 使用 grpc_upstream.sts_client_id/secret 获取 STS token
  # - auth_scheme=apikey 使用 api_key
  # - auth_scheme 留空时，若 api_key 非空则优先 apikey，否则 bearer
  # base_url 不带 API 前缀，统一通过 api_prefix 显式配置（默认 /api/v1）。
  # tenant_uuid 仅用于本地租户标识，proxy 场景由宿主按凭证解析租户。
  base_url: ""
  api_prefix: "/api/v1"
  auth_scheme: "bearer" # bearer | apikey
  api_key: ""
  tenant_uuid: ""
  timeout: "60s"
  user_agent: "powerx-plugin-skeleton/dev"
  use_mock: []

database:
  # 开发建议：默认使用 Postgres（更接近生产；SQLite 仅保留最小可跑通子集，且不保证所有表/约束/时间字段行为一致）。
  driver: "postgres"
  # 你可以复用本机 Postgres，但务必使用独立 schema，避免与宿主/其它插件冲突。
  # 先确保数据库存在（例如 com_powerx_plugin_base），schema 会由程序自动创建。
  dsn: "postgres://powerx:powerx@localhost:5432/com_powerx_plugin_base?sslmode=disable"
  schema: "public"
  # 如需快速本地试跑（最小能力集）可切到 SQLite：
  # driver: "sqlite"
  # dsn: "file:../../.cache/powerxplugin.db?cache=shared&_fk=1"
  # schema: ""
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 1h
  connMaxIdleTime: 30m
  slowThreshold: 200ms
  preferSimpleProtocol: true
  prepareStmt: false
  skipDefaultTx: false
  logLevel: "silent"
  devMode: false
  healthTimeout: 5s

cache:
  driver: "redis"
  host: "localhost"
  port: 6379
  password: ""
  db: 0

runtime:
  run_migrate: false
  drivers:
    # auto: POWERX_PROXY=1 -> host；否则 local
    wsbus: auto      # auto | local | host
    taskbus: auto    # auto | local | host
    event_topic: auto # auto | local | host
    cache: auto      # auto | memory | redis | noop

runtime_ops:
  heartbeat_seconds: 15
  heartbeat_misses: 3
  quota_window_minutes: 5
  restart_backoff_start_seconds: 5
  restart_backoff_max_seconds: 120
  log_retention_days: 7
  cpu_default: "500m"
  memory_default: "512Mi"
  network_profile: "standard"
  observability:
    loki_endpoint: ""
    tempo_endpoint: ""
  alerts:
    health_failure_rate: 0.5
    p95_latency_ms: 500
    error_rate: 0.05
    quota_usage: 0.9
    billing_anomaly: 0.2

context:
  hmac_secret: "dev-hmac-secret"
  key_id: "dev"
  jwks_url: ""
  issuer: ""
  audience: ""
  ttl: "120h"

security:
  enable_cors: true
  cors_origins:
    - "http://localhost:3031"
    - "http://127.0.0.1:3031"
  rate_limit:
    enabled: false

# Customer 鉴权（Mini-App / 2C）
# - local: Skeleton 模式，插件自管 customer 表与登录签发
# - delegate: 宿主模式，插件转发到 PowerX CRM/IAM 校验端点，不落库
customer_auth:
  mode: "local" # local | delegate
  delegate_endpoint: "" # delegate 模式必填，例如 http://127.0.0.1:8077/api/v1/customer/auth/validate
  delegate_timeout: "3s"
  jwt_issuer: ""   # local 模式可选：覆盖 issuer
  jwt_audience: "" # local 模式可选：覆盖 audience
  jwt_secret: ""   # local 模式必填（生产环境），开发可通过 env 注入
  cache_ttl_seconds: 0 # 0=禁用；delegate 模式缓存 TTL 不得超过 token exp

monitoring:
  metrics:
    enabled: true
    path: "/api/v1/admin/runtime/metrics"
  health_check:
    enabled: true
    path: "/healthz"
    app_name: "com.powerx.plugins.scrm"
    version: "dev"

logging:
  level: "debug"
  format: "text"
  output: "stdout"

integration:
  idempotency:
    provider: redis
    redis_url: "redis://localhost:6379"
    ttl_hours: 24
  envelope:
    payload_threshold_bytes: 1048576
  webhook:
    retry_policy: [60, 300, 900]
    dlq_topic: "plugin.webhook.dlq"
  secrets:
    rotation_days_default: 30
  billing:
    tax_provider: stripe_tax
    stripe_tax:
      api_key: "sk_test_xxx"
      user_id: ""
      location: "US"
      api_base_url: "https://api.stripe.com"
      webhook_secret: ""
      timeout_seconds: 15
    avalara:
      user_id: ""
      license_key: ""
      company_code: ""
      environment: "sandbox"
      base_url: "https://sandbox-rest.avatax.com"
      client_id: ""
      client_secret: ""
      timeout_seconds: 15
    reconciliation:
      vendor_share: 0.8
      platform_share: 0.15
      fee_share: 0.05
      currency: "USD"
    async_queue: "marketplace.billing.async"
    http_timeout_seconds: 15
    retry_backoff_seconds: [5, 30, 120]

marketplace:
  checklist:
    graphql_path: "/api/v1/admin/marketplace/checklist/graphql"
    docs_url: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
  documentation:
    overview: "specs/006-marketplace-business/quickstart.md"
    ready_checklist: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
    listing_playbook: "specs/006-marketplace-business/spec.md"
  recommendation:
    enabled: false
    default_weight: 0.0
    experiment_topic: "marketplace.recommendation.experiments"
    frequency_minutes: 60
  license:
    offline_allowance_hours: 72
    cache:
      provider: redis
      redis_url: "redis://localhost:6379"
      key_prefix: "powerx:marketplace:licenses"
    reminder:
      lead_hours: 0
      channels: []

operations:
  support:
    webhook_secret: "replace-me"
    default_channels:
      - channel: "marketplace_ticket"
        address: "https://support.powerx.dev/plugins/base"
        escalates: ["agent", "engineer"]
      - channel: "vendor_email"
        address: "vendor-support@example.com"
        escalates: ["agent", "manager"]
      - channel: "emergency_hotline"
        address: "+1-800-555-0100"
        escalates: ["manager"]
  incident:
    status_page_url: "https://status.powerx.dev/plugins/base"
    security_contacts: ["security@powerx.io"]
    communication_modes: ["support_hub", "status_page", "security_email", "hotline"]
  sla:
    timezone: "UTC"
    daily_cron: "0 5 * * *"

# WeCom 线索拉取与会话桥接（004-lead-managment）
# 说明：
# 1) 渠道账号、授权凭证、回调密钥等账号级参数统一来自数据库（渠道账号表），
#    不在 config/.env 中按账号写死；
# 2) 此处仅保留流程级默认值（批量大小、重试、请求体上限等）。
lead_capture:
  channel_code:
    enabled: true
    event_webhook_enabled: true
    event_idempotency_ttl_hours: 72
    stats_window_minutes: 60
  wecom_sync:
    enabled: true
    cron: "*/10 * * * *"
    batch_size: 200
    timeout: "30s"
    max_retries: 3
    retry_backoff_seconds: [30, 120, 300]
    # 提示：若后续需要环境级全局开关，可仅保留“全局默认值”，
    #      账号级参数仍以数据库为准。
  conversation_webhook:
    enabled: true
    verify_signature: true
    idempotency_ttl_hours: 72
    max_body_bytes: 1048576
  welcome_sync:
    enabled: true
    # 保存与发布分离：保存配置不会自动同步，必须人工触发发布
    auto_publish_on_save: false
    # 三次退避重试（与 spec 默认值对齐）
    retry_backoff_seconds: [5, 15, 30]
    max_retries: 3

# 如需切换到 Postgres，可以将 driver 设置为 postgres 并提供 dsn，例如：
# database:
#   driver: "postgres"
#   dsn: "postgres://powerx:powerx@localhost:5432/com_powerx_plugin_base?sslmode=disable"
#   schema: "public"
