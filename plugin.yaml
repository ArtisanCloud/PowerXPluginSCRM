id: com.powerx.plugins.scrm
name: PowerX SCRM Plugin
version: 0.1.0
description: "PowerX SCRM 插件描述"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: tenant_data_classification
    type: pii_inventory
    retention: 365d
    requires_consent: true

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ${POWERX_BIND_ADDR:-:8086}
    POWERX_PROXY: "1"
    IAMMode: "delegated"
    POWERX_PLUGIN_ID: "com.powerx.plugins.scrm"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.plugins.scrm"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 8086
  health: /healthz

endpoints:
  http_base_path: /api/v1

catalogs:
  capabilities: ./plugin.d/capabilities.yaml
  exposure: ./plugin.d/exposure.yaml
  agent_tools: ./plugin.d/agent_tools.yaml
  events: ./plugin.d/events.yaml
  rbac: ./plugin.d/rbac.yaml

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROXY: "1"
        IAMMode: "delegated"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces: [menus]
      locales: [zh-CN, en]
    menus:
      - id: plugins.com.powerx.plugins.scrm
        title: PowerX SCRM Plugin
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugins.scrm.template
          default: PowerX SCRM Plugin Console
        icon: i-heroicons-clipboard-document-check
        path: /intro
        route: intro
        order: 20
        slot: group.plugins
        required_policies: [com.powerx.plugins.scrm:template:read]
        children:
          - id: plugins.com.powerx.plugins.scrm.intro
            title: PowerX SCRM Plugin Intro
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.intro
              default: PowerX SCRM Plugin Intro
            icon: i-heroicons-information-circle
            path: /intro
            route: intro
            order: 1
          - id: plugins.com.powerx.plugins.scrm.org_sync
            title: 组织映射管理
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.org_sync.title
              default: 组织映射管理
            icon: i-heroicons-squares-2x2
            path: /scrm/org_sync
            route: scrm/org_sync
            order: 5
            children:
              - id: plugins.com.powerx.plugins.scrm.org_sync.main_view
                title: 主组织视图
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.org_sync.main_view
                  default: 主组织视图
                icon: i-heroicons-users
                path: /scrm/org_sync/main_view
                route: scrm/org_sync/main_view
                order: 1
          - id: plugins.com.powerx.plugins.scrm.templates
            title: 模版
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.templates.title
              default: Templates
            icon: i-heroicons-clipboard-document-list
            path: /templates
            route: templates
            order: 2
            children:
              - id: plugins.com.powerx.plugins.scrm.templates.develop
                title: 开发介绍
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.templates.develop
                  default: Templates Develop Intro
                icon: i-heroicons-document-text
                path: /templates/develop
                route: templates/develop
                order: 1
              - id: plugins.com.powerx.plugins.scrm.templates.crud
                title: 模版 CRUD
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.templates.crud
                  default: Templates CRUD
                icon: i-heroicons-wrench
                path: /templates/crud
                route: templates/crud
                order: 2

agents:
  - id: com.powerx.plugins.scrm.assistant
    plugin_id: com.powerx.plugins.scrm
    name: PowerX SCRM Plugin 助理
    description: "PowerX SCRM Plugin 内置 Agent"
    default_tools:
      - com.powerx.plugins.scrm.template.create

tools:
  - id: com.powerx.plugins.scrm.template.create
    plugin_id: com.powerx.plugins.scrm
    name: 创建示例
    description: 创建示例数据
    transport: http
    endpoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
    method: POST
    rbac_resource: template

dependencies:
  requires: []

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: PowerX SCRM Team
  license: MIT
