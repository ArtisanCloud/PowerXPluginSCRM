# plugin.yaml 是 PowerX 插件管理器读取的 Manifest，声明插件固定的元信息与能力。
# 生成后请根据实际情况补充描述、数据使用、权限等信息。
id: com.powerx.plugin.scrm
name: Powerx Plugin Scrm Plugin
version: 0.1.0
description: "Powerx Plugin Scrm Plugin 插件描述"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: tenant_data_classification
    type: pii_inventory
    retention: 365d
    requires_consent: true

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ${POWERX_BIND_ADDR:-:8086}
    POWERX_PROXY: "1"
    POWERX_PLUGIN_ID: "com.powerx.plugin.scrm"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.plugin.scrm"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 8086
  health: /healthz

endpoints:
  http_base_path: /api/v1

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROXY: "1"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces:
        - menus
      locales:
        - zh-CN
        - en
    menus:
      - id: plugins.com.powerx.plugin.scrm
        title: Powerx Plugin Scrm Plugin
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugin.scrm.template
          default: Powerx Plugin Scrm Plugin Console
        icon: i-heroicons-clipboard-document-check
        path: /intro
        route: intro
        order: 20
        slot: group.plugins
        required_policies: [com.powerx.plugin.scrm:template:read]
        children:
          - id: plugins.com.powerx.plugin.scrm.intro
            title: Powerx Plugin Scrm Plugin Intro
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugin.scrm.intro
              default: Powerx Plugin Scrm Plugin Intro
            icon: i-heroicons-information-circle
            path: /intro
            route: intro
            order: 1
          - id: plugins.com.powerx.plugin.scrm.templates
            title: 模版
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugin.scrm.templates.title
              default: Templates
            icon: i-heroicons-clipboard-document-list
            path: /templates
            route: templates
            order: 2
            children:
              - id: plugins.com.powerx.plugin.scrm.templates.develop
                title: 开发介绍
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugin.scrm.templates.develop
                  default: Templates Develop Intro
                icon: i-heroicons-document-text
                path: /templates/develop
                route: templates/develop
                order: 1
              - id: plugins.com.powerx.plugin.scrm.templates.crud
                title: 模版 CRUD
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugin.scrm.templates.crud
                  default: Templates CRUD
                icon: i-heroicons-wrench
                path: /templates/crud
                route: templates/crud
                order: 2

routes:
  basePath: /api/v1
  adminManifest: /api/v1/admin/manifest
  rbac: /api/v1/admin/rbac

rbac:
  resources:
    - resource: com.powerx.plugin.scrm:template
      actions: [read, create, update, delete]

permissions:
  - resource: com.powerx.plugin.scrm:template
    actions: [read, create, update, delete]

agents:
  - id: com.powerx.plugin.scrm.assistant
    plugin_id: com.powerx.plugin.scrm
    name: Powerx Plugin Scrm Plugin 助理
    description: "Powerx Plugin Scrm Plugin 内置 Agent"
    default_tools:
      - com.powerx.plugin.scrm.template.create

capabilities:
  imports:
    - contracts/capabilities/com.powerx.plugin.scrm.template.list.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.read.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.create.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.update.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.delete.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.review.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.publish.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.compose.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.audit.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.batch_clone.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.validate.yaml
    - contracts/capabilities/com.powerx.plugin.scrm.template.quality_distribute.yaml

agent_tools:
  - id: com.powerx.plugin.scrm.template.create
    capability: com.powerx.plugin.scrm.template.create
    handler: backend/internal/handlers/capabilities/template/create_handler.go
    description: 创建示例模板

exposure:
  channels:
    - type: rest
      capability: com.powerx.plugin.scrm.template.create
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
      method: POST
      auth: jwt
      rbac: com.powerx.plugin.scrm:template
    - type: agent_tool
      capability: com.powerx.plugin.scrm.template.create
      agent_tool_id: com.powerx.plugin.scrm.template.create

# 工具清单侧重声明接口契约，真实业务参数通过 config.yaml 或环境变量注入
tools:
  - id: com.powerx.plugin.scrm.template.create
    plugin_id: com.powerx.plugin.scrm
    name: 创建示例
    description: 创建示例数据
    transport: http
    endpoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
    method: POST
    rbac_resource: com.powerx.plugin.scrm:template

dependencies:
  requires: []

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

events:
  produces: []

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: Powerx Plugin Scrm Plugin Team
  license: MIT
