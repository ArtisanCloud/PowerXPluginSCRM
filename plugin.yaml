id: com.powerx.plugins.scrm
name: PowerX SCRM Plugin
version: 0.1.0
description: "PowerX SCRM 插件描述"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: tenant_data_classification
    type: pii_inventory
    retention: 365d
    requires_consent: true

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ${POWERX_BIND_ADDR:-:8086}
    POWERX_PROXY: "1"
    IAMMode: "delegated"
    POWERX_PLUGIN_ID: "com.powerx.plugins.scrm"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.plugins.scrm"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 8086
  health: /healthz

endpoints:
  http_base_path: /api/v1

catalogs:
  capabilities: ./plugin.d/capabilities.yaml
  exposure: ./plugin.d/exposure.yaml
  agent_tools: ./plugin.d/agent_tools.yaml
  events: ./plugin.d/events.yaml
  rbac: ./plugin.d/rbac.yaml

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROXY: "1"
        IAMMode: "delegated"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces: [menus]
      locales: [zh-CN, en]
    menus:
      - id: plugins.com.powerx.plugins.scrm
        title: SCRM
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugins.scrm.root.title
          default: SCRM
        icon: i-heroicons-users
        path: /scrm/social_channel_governance
        route: scrm/social_channel_governance
        order: 20
        slot: group.plugins
        children:
          - id: plugins.com.powerx.plugins.scrm.channel_access
            title: 渠道接入
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.channel_access.title
              default: 渠道接入
            icon: i-heroicons-globe-alt
            path: /scrm/social_channel_governance
            route: scrm/social_channel_governance
            order: 1
            required_policies: ["scrm.social_channel_accounts:read"]
            children:
              - id: plugins.com.powerx.plugins.scrm.channel_access.dashboard
                title: 触点看板
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.channel_access.dashboard
                  default: 触点看板
                icon: i-heroicons-globe-alt
                path: /scrm/social_channel_governance
                route: scrm/social_channel_governance
                order: 1
                required_policies: ["scrm.social_channel_accounts:read"]
              - id: plugins.com.powerx.plugins.scrm.channel_access.accounts
                title: 账号接入
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.channel_access.accounts
                  default: 账号接入
                icon: i-heroicons-link
                path: /scrm/social_channel_governance/unified-access
                route: scrm/social_channel_governance/unified-access
                order: 2
                required_policies: ["scrm.social_channel_accounts:read"]
          - id: plugins.com.powerx.plugins.scrm.leads_opportunity
            title: 线索与商机
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.leads_opportunity.title
              default: 线索与商机
            icon: i-heroicons-funnel
            path: /scrm/lead_capture
            route: scrm/lead_capture
            order: 2
            children:
              - id: plugins.com.powerx.plugins.scrm.leads
                title: 线索管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.leads.title
                  default: 线索管理
                icon: i-heroicons-bolt
                path: /scrm/lead_capture
                route: scrm/lead_capture
                order: 1
                required_policies: ["scrm.leads:read"]
              - id: plugins.com.powerx.plugins.scrm.opportunity
                title: 商机管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.opportunity.title
                  default: 商机管理
                icon: i-heroicons-currency-dollar
                path: /scrm/opportunity
                route: scrm/opportunity
                order: 2
                required_policies: ["scrm.opportunity:read"]
          - id: plugins.com.powerx.plugins.scrm.channel_org_tags
            title: 渠道组织与标签
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.scrm.channel_org_tags.title
              default: 渠道组织与标签
            icon: i-heroicons-squares-2x2
            path: /scrm/org_sync
            route: scrm/org_sync
            order: 3
            required_policies: ["scrm.social_channel_accounts:read"]
            children:
              - id: plugins.com.powerx.plugins.scrm.org_management
                title: 组织管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.org_management.title
                  default: 组织管理
                icon: i-heroicons-home-modern
                path: /scrm/org_sync
                route: scrm/org_sync
                order: 1
                required_policies: ["scrm.social_channel_accounts:read"]
              - id: plugins.com.powerx.plugins.scrm.org_sync_center
                title: 组织同步
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.org_sync_center.title
                  default: 组织同步
                icon: i-heroicons-arrow-path
                path: /scrm/sync_center?domain=org
                route: scrm/sync_center
                order: 2
                required_policies: ["scrm.social_channel_accounts:read"]
              - id: plugins.com.powerx.plugins.scrm.org_staff_tags
                title: 员工标签
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.org_staff_tags.title
                  default: 员工标签
                icon: i-heroicons-tag
                path: /scrm/org_staff_tags
                route: scrm/org_staff_tags
                order: 3
                required_policies: ["scrm.social_channel_accounts:read"]
              - id: plugins.com.powerx.plugins.scrm.org_staff_tag_sync
                title: 员工标签同步
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.scrm.org_staff_tag_sync.title
                  default: 员工标签同步
                icon: i-heroicons-arrow-path-rounded-square
                path: /scrm/org_staff_tag_sync
                route: scrm/org_staff_tag_sync
                order: 4
                required_policies: ["scrm.social_channel_accounts:read"]

agents: []

tools: []

dependencies:
  requires: []

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: .
  once: true
  timeout: 60s

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: PowerX SCRM Team
  icon: icon.svg
  license: MIT
